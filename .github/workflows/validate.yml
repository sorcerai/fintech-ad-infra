name: Validate homepage contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Playwright 1.55
        run: python -m pip install --disable-pip-version-check "playwright==1.55.0"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run homepage contract tests
        run: python -m unittest discover -s .checks -p 'test_contract.py' -v
